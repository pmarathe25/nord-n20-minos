[package]
name = "n20-wiki"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
strip = true
